[package]
name = "rekka"
description = "Redis-backed job queues and typed cache, safe for horizontal scaling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "../../crates.md"
keywords = ["redis", "queue", "jobs", "cache", "background"]
categories = ["asynchronous", "caching", "concurrency"]

[dependencies]
chrono = "0.4.45"
fastrand = "2.5.0"
futures-util = "0.3.34"
redis = { version = "1.7.1", default-features = false, features = ["aio", "tokio-comp", "connection-manager", "script"] }
rekka_derives = { version = "=0.0.6", path = "../rekka_derives" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
