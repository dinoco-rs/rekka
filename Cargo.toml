[workspace]
resolver = "3"
members = ["crates/rekka", "crates/rekka_derives"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

# Pacote raiz: existe apenas para centralizar os testes de integração em `tests/`.
[package]
name = "rekka-tests"
version.workspace = true
edition = "2024"
publish = false
autobins = false
autoexamples = false
autobenches = false

[dev-dependencies]
chrono = "0.4.45"
redis = { version = "1.7.1", default-features = false, features = ["aio", "tokio-comp"] }
rekka = { path = "crates/rekka" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
uuid = { version = "1.28.0", features = ["serde", "v4"] }

[[test]]
name = "suite"
path = "tests/suite/main.rs"
harness = true
